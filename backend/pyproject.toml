[project]
name = "thinkronos"
version = "0.1.0"
description = "Thinkronos のバックエンド（API・ワーカー）"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20",
    "asyncpg>=0.32",
    "celery[redis]>=5.7",
    "fastapi>=0.165",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-sdk>=1.45",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1",
    "strands-agents[ollama]>=1.65",
    "uvicorn>=0.38",
]

[dependency-groups]
dev = [
    "diff-cover>=11",
    "factory-boy>=3.3",
    "httpx>=0.28",
    "import-linter>=2.3",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.5",
    "pytest-cov>=7",
    "ruff>=0.14",
    "testcontainers>=4.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thinkronos"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
# 文書・コメントは日本語で書くため、全角の記号を許す
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["thinkronos", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["celery.*", "testcontainers.*", "strands.*"]
ignore_missing_imports = true

# factory_boy は py.typed を持つが、ほとんど型が付いていない。ファクトリの定義だけ緩める
[[tool.mypy.overrides]]
module = ["factory", "factory.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
module = ["tests.factories.*"]
disallow_untyped_calls = false
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: Docker（Testcontainers）を使う結合テスト",
    "ollama: 実際の Ollama（qwen3:8b）を使う。CI では実行しない",
]
addopts = "-m 'not ollama'"

[tool.coverage.run]
source = ["src/thinkronos"]
relative_files = true

[tool.coverage.report]
show_missing = true
