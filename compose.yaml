name: thinkronos

# api / worker / scheduler は同じイメージ（backend/Dockerfile）で、起動のコマンドだけ変える（ADR 0035）
x-backend: &backend
  image: thinkronos/backend:local
  build: ./backend
  depends_on:
    migrate: {condition: service_completed_successfully}
    redis: {condition: service_healthy}
    lgtm: {condition: service_healthy}
  restart: unless-stopped

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_METRIC_EXPORT_INTERVAL: "10000"
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local

# アプリはテーブルの所有者ではないロール（thinkronos_app）で接続する（D-14）。パスワードは英数字にする（URLに入るため）
x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://thinkronos_app:${APP_DB_PASSWORD:?.env に APP_DB_PASSWORD を足す（.env.example 参照）}@postgres:5432/${POSTGRES_DB:-thinkronos}
  REDIS_URL: redis://redis:6379/0
  OLLAMA_HOST: http://ollama:11434
  OLLAMA_MODEL: qwen3:8b
  WORKER_ASYNC_MODE: run

services:
  postgres:
    image: thinkronos/postgres:18
    build: ./docker/postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?.env を作る（.env.example 参照）}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env を作る}
      POSTGRES_DB: ${POSTGRES_DB:-thinkronos}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports: ["127.0.0.1:${OLLAMA_PORT:-11435}:11434"]
    volumes: [ollama:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 監視（ログ・メトリクス・トレース）。匿名で Admin になるため 127.0.0.1 にだけ公開する（docs/observability.md）
  lgtm:
    image: grafana/otel-lgtm:0.41.1
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    volumes: [lgtmdata:/data]
    mem_limit: 3g
    environment: {LGTM_SHUTDOWN_TIMEOUT_SECONDS: "30"}
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # マイグレーション（所有者のロール）。終わったら止まる。api・worker・scheduler はこれの成功を待つ
  migrate:
    image: thinkronos/backend:local
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-thinkronos}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?.env に APP_DB_PASSWORD を足す（.env.example 参照）}
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    <<: *backend
    environment: {<<: [*otel, *app-env], OTEL_SERVICE_NAME: api}
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]

  worker:
    <<: *backend
    command: ["celery", "-A", "thinkronos.bootstrap:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: {<<: [*otel, *app-env], OTEL_SERVICE_NAME: worker}
    healthcheck:
      test: ["CMD-SHELL", "celery -A thinkronos.bootstrap:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10s

  # 定期実行（celery beat）。登録するスケジュールは今は無い
  scheduler:
    <<: *backend
    command: ["celery", "-A", "thinkronos.bootstrap:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment: {<<: [*otel, *app-env], OTEL_SERVICE_NAME: scheduler}
    healthcheck:
      # beat は HTTP を持たないので、PID 1 が beat であることだけを見る（落ちれば restart で再起動する）
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if b'beat' in open('/proc/1/cmdline','rb').read() else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
  ollama:
  lgtmdata:
