name: thinkronos

x-stub: &stub
  build: ./docker/stub
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    lgtm: {condition: service_healthy}
  healthcheck:
    test: ["CMD", "python", "healthcheck.py"]
    interval: 5s
    timeout: 3s
    retries: 10
  restart: unless-stopped

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_METRIC_EXPORT_INTERVAL: "10000"
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local

services:
  postgres:
    image: thinkronos/postgres:18
    build: ./docker/postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?.env を作る（.env.example 参照）}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env を作る}
      POSTGRES_DB: ${POSTGRES_DB:-thinkronos}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports: ["127.0.0.1:${OLLAMA_PORT:-11435}:11434"]
    volumes: [ollama:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 監視（ログ・メトリクス・トレース）。匿名で Admin になるため 127.0.0.1 にだけ公開する（docs/observability.md）
  lgtm:
    image: grafana/otel-lgtm:0.41.1
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    volumes: [lgtmdata:/data]
    mem_limit: 3g
    environment: {LGTM_SHUTDOWN_TIMEOUT_SECONDS: "30"}
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  api:
    <<: *stub
    environment: {<<: *otel, OTEL_SERVICE_NAME: api, SERVICE_NAME: api, PORT: "8000"}
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]

  worker:
    <<: *stub
    environment: {<<: *otel, OTEL_SERVICE_NAME: worker, SERVICE_NAME: worker, PORT: "8000"}

  scheduler:
    <<: *stub
    environment: {<<: *otel, OTEL_SERVICE_NAME: scheduler, SERVICE_NAME: scheduler, PORT: "8000"}

volumes:
  pgdata:
  redisdata:
  ollama:
  lgtmdata:
