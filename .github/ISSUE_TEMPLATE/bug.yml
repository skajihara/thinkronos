name: Bug
description: 想定どおりに動かない不具合
title: "[bug] "
labels: ["type: fix"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 起きたこと
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      value: |
        1. 
        2. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 発生した環境
      options:
        - 開発
        - 本番相当（ローカル）
        - 会社環境
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: バージョン
      placeholder: 例：v0.1.0、またはコミットSHA
  - type: textarea
    id: logs
    attributes:
      label: ログ・スクリーンショット
      description: ログに秘密情報が含まれていないか確認してから貼る
      render: text
  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      options:
        - Must
        - Should
        - Could
    validations:
      required: true
  - type: checkboxes
    id: hotfix
    attributes:
      label: 緊急度
      options:
        - label: リリース済みのバージョンで起きており、hotfixが必要
